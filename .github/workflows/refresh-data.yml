name: 대회 데이터 자동 갱신

# ⚠️ 임시 패치 (2026-08-07 적용): Netlify 크레딧 소진으로 프로덕션 배포가 막혀서,
# 자동으로 push -> 재배포 시도하는 걸 잠시 껐습니다 (schedule 트리거 비활성화).
# push 자체는 무해하지만, 배포 시도가 반복되며 크레딧/빌드를 계속 소모하는 걸 막기 위함.
# 재활성화 조건: Netlify 크레딧이 8/28 결제 주기 리셋되거나, 플랜 업그레이드된 후.
# 되돌리려면 아래 schedule 블록 주석 해제하면 됩니다.
# 2026-08-17: 주기를 6시간 -> 12시간으로 조정 (하루 빌드 시도 4회 -> 2회, 크레딧 절약).
# 2026-08-29: 배포 1회 = 15크레딧(무료 플랜 월 300) 확인됨. 12시간(하루 2회, 월 900크레딧)은
# 예산을 훨씬 초과해서 3일에 1회(월 10회, 150크레딧)로 재조정.
# 2026-08-30: 스크래퍼 버그 수정 + 도메인 연결 배포 이후로 재활성화.
# 2026-08-30: 크레딧 신중하게 쓰기 위해 9/28(다음 결제 주기 리셋)까지 주 1회로 낮춤.
# 2026-08-30: generatedAt이 매번 오늘 날짜로 찍히도록 고쳐놔서, 실제 대회 데이터가
# 하나도 안 바뀌어도 날짜 한 줄 때문에 매번 배포까지 가버리는 부작용이 생김. 그래서
# "실제 대회 데이터(날짜 제외)가 진짜 바뀐 경우에만 커밋" 단계를 추가함.
# 2026-08-30: 주 1회로 되돌리고, 변화가 있어도 main에 바로 안 올리도록 변경 -
# auto-refresh-pending 브랜치에 올려두고 GitHub 이슈로 요약 보고만 함. 실제 배포는
# 필립님이 확인하고 승인한 뒤 사람이 직접 main에 병합해야 나감 (배포 전 승인 원칙).
# 2026-09-11: 이 워크플로는 스크래핑 + pending 브랜치 준비 + 이슈 알림까지만 하고
# main은 절대 안 건드리기 때문에(위 주석 참고), 아무리 자주 돌려도 Netlify 배포가
# 자동으로 트리거되지 않아 크레딧 소모가 없음을 재확인함 - 이 전제로 주 1회 ->
# 6시간마다(하루 4회, 한국시간 00/06/12/18시)로 다시 올림. 공개 저장소라
# GitHub Actions 실행 시간도 무료.
on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (서울마라톤·JTBC는 JS 렌더링이라 필요)
        run: python -m playwright install --with-deps chromium

      - name: 최신 대회 정보 재수집
        # 2026-09-06: gorunning.kr이 GitHub Actions IP를 차단해서 이 단계가 항상
        # 실패한다 (403). continue-on-error 없으면 이 단계 실패 시 뒤에 있는
        # runfinder.kr 갱신·데이터 재빌드까지 전부 건너뛰어버려서, 고러닝이 막혀도
        # runfinder로 191건은 계속 자동 갱신되게 하려던 목적 자체가 무의미해짐.
        # 실패해도 기존 gorunning_extracted_sample.csv(마지막 정상본)를 그대로 두고
        # 다음 단계로 진행한다.
        continue-on-error: true
        run: python scrape_gorunning.py

      - name: runfinder.kr 신규 대회 재수집 (실패해도 전체 파이프라인은 계속 진행)
        continue-on-error: true
        run: python scrape_runfinder.py

      - name: Tier1 메이저 대회 개별 사이트 재수집 (춘천마라톤)
        continue-on-error: true
        run: python scrape_chuncheon.py

      - name: Tier1 메이저 대회 개별 사이트 재수집 (서울마라톤/동아마라톤)
        continue-on-error: true
        run: python scrape_seoul_marathon.py

      - name: Tier1 메이저 대회 개별 사이트 재수집 (JTBC 서울마라톤)
        continue-on-error: true
        run: python scrape_jtbc_marathon.py

      - name: 데이터 재빌드
        run: python rebuild_all.py && cp data_export.json data.json

      - name: 대회 수 급감 여부 확인 (안전장치)
        run: |
          OLD_COUNT=$(git show HEAD:data.json | python -c "import json,sys; print(len(json.load(sys.stdin)['races']))")
          NEW_COUNT=$(python -c "import json; print(len(json.load(open('data.json', encoding='utf-8'))['races']))")
          echo "이전: $OLD_COUNT 건, 신규: $NEW_COUNT 건"
          THRESHOLD=$((OLD_COUNT * 70 / 100))
          if [ "$NEW_COUNT" -lt "$THRESHOLD" ]; then
            echo "::error::대회 수가 $OLD_COUNT -> $NEW_COUNT 로 급감했습니다 (임계값 $THRESHOLD). 커밋을 중단합니다."
            exit 1
          fi

      - name: 변경 diff 계산 + 보고 여부 판단 (누적 5/10건 또는 Tier1 관련이면 즉시)
        # 2026-09-11 재설계: 예전엔 조금이라도 바뀌면 매번 이슈를 만들어서
        # 6시간마다 돌리면 알림이 너무 잦아짐. diff는 항상 "마지막 배포(main)
        # 이후 누적분"이라 총 건수 자체가 이미 누적치임 - 이걸 이용해서
        # 5건 넘을 때, 10건 넘을 때(5의 배수 단위)만 보고하고, Tier1 메이저
        # 대회가 껴있으면 건수 상관없이 즉시 보고한다. 같은 누적 상태로
        # 반복 알림이 안 가도록 "마지막으로 보고한 건수"를 auto-refresh-pending
        # 브랜치의 notify_state.json에 기록해뒀다가 다음 실행에서 읽어온다
        # (main이 그새 실제 배포로 바뀌었으면 새 누적 주기로 취급해 리셋).
        id: diff
        run: |
          python3 << 'EOF'
          import json, subprocess, os

          old = {r['id']: r for r in json.loads(subprocess.check_output(["git", "show", "HEAD:data.json"]).decode())['races']}
          new = {r['id']: r for r in json.load(open('data.json', encoding='utf-8'))['races']}

          added = [new[i] for i in new if i not in old]
          removed = [old[i] for i in old if i not in new]
          status_changed = [(old[i], new[i]) for i in new if i in old and old[i]['status'] != new[i]['status']]
          total = len(added) + len(removed) + len(status_changed)

          is_big = (any(r.get('tier') == 'Tier1' for r in added + removed)
                    or any(o.get('tier') == 'Tier1' or n.get('tier') == 'Tier1' for o, n in status_changed))

          main_sha = subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip()

          prev_notified, prev_main_sha = 0, None
          try:
              raw = subprocess.check_output(
                  ["git", "show", "origin/auto-refresh-pending:notify_state.json"],
                  stderr=subprocess.DEVNULL).decode()
              state = json.loads(raw)
              prev_notified = state.get("last_notified_count", 0)
              prev_main_sha = state.get("last_main_sha")
          except subprocess.CalledProcessError:
              pass
          if prev_main_sha != main_sha:
              prev_notified = 0  # main이 그새 실제 배포로 바뀜 - 새 누적 주기

          notify = is_big or (total >= 5 and total // 5 > prev_notified // 5)

          lines = []
          if is_big:
              lines.append('## 🚨 Tier1 메이저 대회 관련 변경 - 즉시 확인 요망')
          lines.append(f'누적 변경 {total}건 (마지막 배포 이후 기준)')
          if added:
              lines.append(f'### 신규 대회 ({len(added)}건)')
              for r in added:
                  lines.append(f"- {r['name']} ({r['date']}, {r['region']})" + (' 🏅Tier1' if r.get('tier') == 'Tier1' else ''))
          if removed:
              lines.append(f'### 사라진 대회 ({len(removed)}건)')
              for r in removed:
                  lines.append(f"- {r['name']}")
          if status_changed:
              lines.append(f'### 접수상태 변경 ({len(status_changed)}건)')
              for o, n in status_changed:
                  lines.append(f"- {n['name']}: {o['status']} -> {n['status']}" + (' 🏅Tier1' if n.get('tier') == 'Tier1' else ''))
          open('summary.md', 'w', encoding='utf-8').write('\n'.join(lines) or '(내용 없음)')

          json.dump(
              {"last_notified_count": total if notify else prev_notified, "last_main_sha": main_sha},
              open('notify_state.json', 'w'))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changed={'1' if total > 0 else '0'}\n")
              f.write(f"notify={'1' if notify else '0'}\n")
              f.write(f"total={total}\n")
          EOF

      - name: pending 브랜치에 올리고, 임계값 넘으면 이슈로 보고 (main엔 안 올림 - 배포는 승인 후 사람이)
        if: steps.diff.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "runraider-bot"
          git config user.email "runraider-bot@users.noreply.github.com"
          # jtbc_marathon_update.csv 등 일부 파일은 스크래퍼가 확신이 없을 때
          # 일부러 안 만들고 스킵한다 (2026-09-07 확인됨). git add에 존재하지
          # 않는 경로가 섞이면 "pathspec did not match" 에러로 이 스텝 자체가
          # 죽어버려서(-e 옵션), 있는 파일만 골라 넣는다.
          for f in data.json gorunning_extracted_sample.csv runfinder_new_only.csv runfinder_updates.csv chuncheon_update.csv seoul_marathon_update.csv jtbc_marathon_update.csv sitemap.xml rss.xml races/ notify_state.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "자동 갱신 대기: $(date +'%Y-%m-%d %H:%M') (누적 ${{ steps.diff.outputs.total }}건)"
          git push origin HEAD:auto-refresh-pending --force
          if [ "${{ steps.diff.outputs.notify }}" = "1" ]; then
            gh issue create \
              --title "🔔 대회 데이터 누적 변경 ${{ steps.diff.outputs.total }}건 ($(date +'%Y-%m-%d %H:%M'))" \
              --body-file summary.md \
              --label "auto-refresh"
          else
            echo "누적 ${{ steps.diff.outputs.total }}건 - 아직 보고 임계값(5건) 미달, 조용히 pending 브랜치만 갱신"
          fi
